<svg xmlns="http://www.w3.org/2000/svg" width="680" height="500" viewBox="0 0 680 500" role="img"><title>A fresh container for every attempt</title><desc>Attempt 1 runs in container A: a read-only pinned image plus an empty writable layer. It writes a scratch file and exits 3. Podman removes the container and its layer. Temporal retries in container B, with the same image and a new empty layer, so the retry can't see the scratch file. Only container B's standard output leaves, as the activity result in Temporal, which loom's Record activity commits to the warp store. The store is outside every container.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{stroke:#5F5E5A;stroke-width:1.5;fill:none}.dot{fill:#5F5E5A}
.d{stroke:#888780;stroke-width:0.8;fill:none;stroke-dasharray:5 4}
.l{font-size:12px;fill:#5F5E5A}.f{font-size:13px;fill:#444441}
.t1{font-size:14px;font-weight:600}.t2{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t1{fill:#3C3489}.p .t2{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t1{fill:#085041}.g .t2{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t1{fill:#712B13}.c .t2{fill:#993C1D}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t1{fill:#444441}.n .t2{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.w{stroke:#B4B2A9}.dot{fill:#B4B2A9}.d{stroke:#888780}.l{fill:#B4B2A9}.f{fill:#D3D1C7}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t1{fill:#EEEDFE}.p .t2{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t1{fill:#E1F5EE}.g .t2{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t1{fill:#FAECE7}.c .t2{fill:#F5C4B3}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t1{fill:#F1EFE8}.n .t2{fill:#D3D1C7}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><path class="w" d="M180 24 L180 54" marker-end="url(#a)"/><text class="l" x="190" y="42" text-anchor="start">upstream outputs as JSON on stdin</text><rect class="d" x="40" y="60" width="280" height="200" rx="12"/><text class="l" x="52" y="80" text-anchor="start">container A · attempt 1</text><g class="n"><rect x="60" y="92" width="240" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="180.0" y="107.0" text-anchor="middle" dominant-baseline="central">image (read-only)</text><text class="t2" x="180.0" y="126.0" text-anchor="middle" dominant-baseline="central">pinned by content ID</text></g><g class="c"><rect x="60" y="152" width="240" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="180.0" y="167.0" text-anchor="middle" dominant-baseline="central">writable layer</text><text class="t2" x="180.0" y="186.0" text-anchor="middle" dominant-baseline="central">writes /scratch</text></g><text class="l" x="180" y="230" text-anchor="middle">exit 3 → retryable; --rm discards it</text><path class="w" d="M322 176 L356 176" marker-end="url(#a)"/><text class="l" x="339" y="166" text-anchor="middle">retry</text><rect class="d" x="360" y="60" width="280" height="200" rx="12"/><text class="l" x="372" y="80" text-anchor="start">container B · attempt 2</text><g class="n"><rect x="380" y="92" width="240" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="500.0" y="107.0" text-anchor="middle" dominant-baseline="central">same image (read-only)</text><text class="t2" x="500.0" y="126.0" text-anchor="middle" dominant-baseline="central">nothing changed</text></g><g class="c"><rect x="380" y="152" width="240" height="48" rx="6" stroke-width="0.8"/><text class="t1" x="500.0" y="167.0" text-anchor="middle" dominant-baseline="central">new writable layer</text><text class="t2" x="500.0" y="186.0" text-anchor="middle" dominant-baseline="central">empty: no /scratch</text></g><text class="l" x="500" y="230" text-anchor="middle">stdout: clean; then discarded too</text><path class="w" d="M500 260 L500 326" marker-end="url(#a)"/><text class="l" x="510" y="300" text-anchor="start">output only</text><g class="p"><rect x="450" y="330" width="190" height="56" rx="6" stroke-width="0.8"/><text class="t1" x="545.0" y="349.0" text-anchor="middle" dominant-baseline="central">Temporal</text><text class="t2" x="545.0" y="368.0" text-anchor="middle" dominant-baseline="central">activity result</text></g><path class="w" d="M450 358 L429 358" marker-end="url(#a)"/><g class="p"><rect x="255" y="330" width="172" height="56" rx="6" stroke-width="0.8"/><text class="t1" x="341.0" y="349.0" text-anchor="middle" dominant-baseline="central">loom Record</text><text class="t2" x="341.0" y="368.0" text-anchor="middle" dominant-baseline="central">activity</text></g><path class="w" d="M255 358 L234 358" marker-end="url(#a)"/><g class="g"><rect x="40" y="330" width="192" height="56" rx="6" stroke-width="0.8"/><text class="t1" x="136.0" y="349.0" text-anchor="middle" dominant-baseline="central">warp store (Git)</text><text class="t2" x="136.0" y="368.0" text-anchor="middle" dominant-baseline="central">never mounted</text></g><text class="f" x="340" y="424" text-anchor="middle">attempt = fresh layer ; ⟦image⟧ ; discard  ·  retry = attempt again, never resume</text><text class="l" x="340" y="450" text-anchor="middle">No volumes, no network, no host environment: a container sees its image, args, env and stdin.</text><text class="l" x="340" y="474" text-anchor="middle">Coral: thrown away · Gray: read-only image · Purple: execution · Teal: the Git store</text></svg>
